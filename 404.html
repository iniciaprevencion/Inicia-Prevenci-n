<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página no encontrada · IniciaPrevención</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Open Sans', sans-serif;
  background: linear-gradient(135deg, #0C447C 0%, #185FA5 100%);
  color: #FFFFFF;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}
.box { max-width: 520px; }
.code {
  font-family: 'Montserrat', sans-serif;
  font-size: 96px;
  font-weight: 700;
  color: #EF9F27;
  line-height: 1;
}
h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: 28px;
  margin: 16px 0 12px;
  color: #FFFFFF;
}
p {
  color: #B5D4F4;
  margin-bottom: 32px;
  font-size: 16px;
}
a {
  background: #EF9F27;
  color: #FFFFFF;
  padding: 14px 28px;
  border-radius: 4px;
  text-decoration: none;
  font-weight: 600;
  display: inline-block;
  transition: background 0.2s;
}
a:hover { background: #BA7517; }
.brand { margin-bottom: 48px; font-size: 14px; letter-spacing: 2px; color: #EF9F27; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">INICIAPREVENCIÓN</div>
  <div class="code">404</div>
  <h1>Página no encontrada</h1>
  <p>La página que estás buscando no existe o fue movida. Te invitamos a volver al inicio.</p>
  <a href="/">Volver al inicio</a>
</div>
</body>
</html>
